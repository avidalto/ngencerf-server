<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Login / Activation Handler</title>
</head>
<body>

<!--
Route
-----
/login?action=activate&uid=UID&token=TOKEN

Purpose
-------
This uses the shared login page as the landing page for the Djoser activation email.

Even though accounts are already active in this system,
the activation email is used to verify the user's email.

Example link
------------

https://app.example.com/login?action=activate&uid=ABC123&token=XYZ456

UI behavior on page load
------------------------
Read the query parameters:

    action=activate
    uid
    token

Immediately call:

POST /auth/users/activation/

Body:
{
  "uid": "<uid>",
  "token": "<token>"
}

Auth: NOT required

Backend behavior
----------------
On success, Djoser emits:

    user_activated

Your signal handler sets:

    email_verified = True

After server call returns
-------------------------
If response == 204:

    email successfully verified.

    redirect user to:

        /dashboard

If response == 400:

    activation link invalid or expired.

    show links to:

        /login
        /verify-email-required

If response == 500:

    show generic error and allow retry.
-->

<h1>Verifying your email...</h1>

<p>Please wait while we confirm your activation link.</p>

<hr>

<h2>If activation fails</h2>

<p><a href="/login">Back to Login</a></p>
<p><a href="/verify-email-required">Resend verification</a></p>

</body>
</html>

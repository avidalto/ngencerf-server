<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Set New Password</title>
</head>
<body>

<!--
Route
-----
/reset-password?uid=UID&token=TOKEN

Purpose
-------
Landing page from password reset email.

Example link
------------

https://app.example.com/reset-password?uid=ABC123&token=XYZ456

UI behavior on page load
------------------------
Extract uid and token from URL.

Display form asking for new password twice.

Server call on submit
---------------------

POST /auth/users/reset_password_confirm/

Body:

{
  "uid": "<uid>",
  "token": "<token>",
  "new_password": "<password>",
  "re_new_password": "<password>"
}

Note
----
Djoser requires both password fields because:

    SET_PASSWORD_RETYPE = True

After server call returns
-------------------------
If response == 204:

    password successfully updated.

    redirect user to:

        /login

If response == 400:

    display validation errors.

If response == 500:

    show generic error and allow retry.
-->

<h1>Set a new password</h1>

<form>

    <label>New password:</label>
    <input type="password" name="new_password">

    <br><br>

    <label>Retype password:</label>
    <input type="password" name="re_new_password">

    <br><br>

    <button type="submit">Update Password</button>

</form>

<p><a href="/login">Back to Login</a></p>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Verifying Email</title>
</head>
<body>

<!--
Route
-----
/verify-email?token=SIGNED_TOKEN

Purpose
-------
Landing page for verification links generated by the custom endpoint:

POST /auth/users/send_verification_email/

Example email link
------------------

https://app.example.com/verify-email?token=SIGNED_TOKEN

UI behavior on page load
------------------------
Extract "token" from URL query parameters.

Immediately call:

POST /auth/users/verify_email_confirm/

Body:
{
  "token": "<SIGNED_TOKEN>"
}

Auth: NOT required

After server call returns
-------------------------
If response == 204:

    Email verification succeeded.

    Redirect user to:

        /dashboard

If response == 400:

    If token expired:
        show message and link to:

            /verify-email-required

    If invalid token:
        show message and link to:

            /verify-email-required

If response == 500:

    show generic error and allow retry.
-->

<h1>Verifying your email...</h1>

<p>Please wait while we confirm your email verification link.</p>

<hr>

<h2>If verification fails</h2>

<p><a href="/verify-email-required">Resend verification</a></p>
<p><a href="/login">Back to Login</a></p>

</body>
</html>

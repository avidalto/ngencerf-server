<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Password Reset Email Sent</title>
</head>
<body>

<!--
Route
-----
/password-reset-email-sent

Purpose
-------
Displayed after a password reset email has been requested.

UI behavior on page load
------------------------
Display instructions telling the user to check their email.

No server call required.

The reset link will now go to the shared login page with an action discriminator.

After previous server call
--------------------------
If prior reset request returned 204:

    user should check email and click the reset link.
-->

<h1>Password Reset Email Sent</h1>

<p>Please check your email and click the password reset link.</p>

<p>If you don't see the email, check your spam folder.</p>

<p><a href="/login">Back to Login</a></p>

</body>
</html>

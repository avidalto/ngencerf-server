<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Forgot Password</title>
</head>
<body>

<!--
Route
-----
/forgot-password

Purpose
-------
Allows a user to request a password reset email.

The reset email link now goes to the shared login page with an action discriminator.

UI behavior on page load
------------------------
Display a form asking for the user's email address.

Server call on submit
---------------------

POST /auth/users/reset_password/

Body:
{
  "email": "<user email>"
}

Auth: NOT required

After server call returns
-------------------------
If response == 204:

    redirect to:

        /password-reset-email-sent

If response == 400:

    display validation errors.

If response == 500:

    show generic error and allow retry.
-->

<h1>Reset your password</h1>

<form>

    <label>Email:</label>
    <input type="email" name="email">

    <button type="submit">Send Reset Link</button>

</form>

<p><a href="/login">Back to Login</a></p>

</body>
</html>
